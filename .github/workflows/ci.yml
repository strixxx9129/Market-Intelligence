name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: marketlens
          POSTGRES_PASSWORD: marketlens
          POSTGRES_DB: marketlens_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U marketlens -d marketlens_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20

    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://marketlens:marketlens@localhost:5432/marketlens_test
      TEST_DATABASE_URL: postgresql+asyncpg://marketlens:marketlens@localhost:5432/marketlens_test
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.0"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install Python and dependencies (locked)
        run: |
          uv python install 3.12
          uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check --output-format=github .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy (strict)
        run: uv run mypy

      - name: Pytest
        run: uv run pytest

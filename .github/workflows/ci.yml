name: CI

# Pull requests run CI directly. On main, CD (cd.yml) calls this same workflow first, so the
# code that gets deployed is exactly the code that passed these checks.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: marketlens
          POSTGRES_PASSWORD: marketlens
          POSTGRES_DB: marketlens_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U marketlens -d marketlens_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20

    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://marketlens:marketlens@localhost:5432/marketlens_test
      TEST_DATABASE_URL: postgresql+asyncpg://marketlens:marketlens@localhost:5432/marketlens_test
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.8.0"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install Python and dependencies (locked)
        run: |
          uv python install 3.12
          uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check --output-format=github .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Ruff on scripts/ and notebooks/ (root ruff.toml)
        run: uv run ruff check ../scripts ../notebooks && uv run ruff format --check ../scripts ../notebooks

      - name: Feature catalog is up to date
        run: uv run python ../scripts/gen_feature_catalog.py --check

      - name: OpenAPI snapshot (frontend/openapi.json) is up to date
        run: uv run python ../scripts/export_openapi.py --check

      - name: Mypy (strict)
        run: uv run mypy

      - name: Pytest
        run: uv run pytest

      # An untested backup is a hope, not a backup: back up the CI database, restore it into
      # a scratch database and require identical row counts (docs/runbooks/restore.md).
      - name: Backup + restore drill
        run: |
          uv run alembic upgrade head && uv run marketlens seed-assets
          docker build -q -f ../infra/backup/Dockerfile -t marketlens-backup ..
          docker run --rm --network host             -e DATABASE_URL=postgresql://marketlens:marketlens@localhost:5432/marketlens_test             -e DRILL_DATABASE_URL=postgresql://marketlens:marketlens@localhost:5432/marketlens_drill             -e DRILL_ADMIN_URL=postgresql://marketlens:marketlens@localhost:5432/marketlens_test             -e BACKUP_URI=file:///tmp/backups             marketlens-backup restore_drill.sh

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6  # version from package.json "packageManager"
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install (locked)
        run: pnpm install --frozen-lockfile

      - name: Generated API client matches openapi.json
        run: pnpm gen:api:check

      - name: ESLint + Prettier
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Workflow syntax, expressions and embedded shell (actionlint bundles shellcheck).
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color

      - name: shellcheck scripts
        run: >
          docker run --rm -v "$PWD:/repo" -w /repo --entrypoint shellcheck
          rhysd/actionlint:1.7.7 -s sh scripts/*.sh

      - name: Production image builds, runs as non-root, refuses unsafe config
        run: |
          docker build -q --target prod -t marketlens-backend:prod backend
          test "$(docker run --rm --entrypoint id marketlens-backend:prod -u)" = "1000"
          if docker run --rm -e ENVIRONMENT=prod marketlens-backend:prod python -c "import marketlens.main"; then
            echo "prod image started with dev defaults: fail-fast is broken" >&2; exit 1
          fi

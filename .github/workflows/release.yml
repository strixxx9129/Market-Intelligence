# Pushing a tag vX.Y.Z publishes a GitHub Release whose notes are generated from the
# Conventional Commits since the previous tag (git-cliff, config in cliff.toml).
# CHANGELOG.md in the repo is generated by the same config (`make changelog`).
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history: notes are built from commits between tags

      - name: Release notes from Conventional Commits
        id: notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header

      - uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.notes.outputs.content }}
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}

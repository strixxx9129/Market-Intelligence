# Install once (host needs uv): uv tool install pre-commit && pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-added-large-files
        args: [--maxkb=1024]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.0
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  # mypy runs in the project's own environment (via uv) so it sees the real dependencies;
  # the isolated mirrors-mypy hook would miss SQLAlchemy/Pydantic types.
  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict, backend/src)
        entry: uv run --directory backend mypy
        language: system
        files: ^backend/src/.*\.py$
        pass_filenames: false

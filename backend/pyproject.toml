[project]
name = "marketlens"
version = "0.1.0"
description = "Open-source Market Intelligence & ML Monitoring Platform (educational, not financial advice)."
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis>=5.0",
    "structlog>=24.1",
    "celery>=5.4",
    "pandas>=2.2",
    "numpy>=2.0",
    "pandera>=0.24",
    "typer>=0.12",
]

[project.scripts]
marketlens = "marketlens.cli:app"

# Plugin point: third-party packages register connectors under this group, e.g.
#   [project.entry-points."marketlens.connectors"]
#   my_source = "my_pkg.connector:MyConnector"
[project.entry-points."marketlens.connectors"]
kaggle_btc = "marketlens.ingestion.connectors.kaggle_btc:KaggleBtcConnector"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
]
# Exploration only (notebooks/, scripts/). Never installed in the api/worker images.
eda = [
    "pyarrow>=17",
    "matplotlib>=3.9",
    "scipy>=1.14",
    "statsmodels>=0.14",
    "kaggle>=1.6",
    "jupyterlab>=4.2",
    "jupytext>=1.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marketlens"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "ASYNC",    # async pitfalls
    "DTZ",      # naive datetimes (rule 4: everything UTC)
    "RUF",
]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]  # the local alembic/ folder would otherwise look first-party

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]

[[tool.mypy.overrides]]
module = ["celery", "celery.*", "pandas", "pandas.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # lets tests import shared helpers as `tests.fixtures...`
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: needs a real PostgreSQL / Redis (run inside docker compose or CI)",
]
addopts = "-ra --strict-markers"

# git-cliff: CHANGELOG.md and GitHub release notes from Conventional Commits.
#   make changelog              (regenerate CHANGELOG.md; run before tagging a release)
# Commit types map to sections; `chore(release)` commits (the changelog itself) are skipped.

[changelog]
header = """
# Changelog

All notable changes to MarketLens. Generated from [Conventional Commits](https://www.conventionalcommits.org/)
by [git-cliff](https://git-cliff.org); versions follow [SemVer](https://semver.org/).
MarketLens is educational software, not financial advice.\n
"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }} \
([{{ commit.id | truncate(length=7, end="") }}]($REPO/commit/{{ commit.id }}))\
{% endfor %}
{% endfor %}\n
"""
footer = ""
trim = true
postprocessors = [
  { pattern = '\$REPO', replace = "https://github.com/strixxx9129/Market-Intelligence" },
]

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
commit_parsers = [
  { message = "^chore\\(release\\)", skip = true },
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Refactoring" },
  { message = "^docs", group = "<!-- 4 -->Documentation" },
  { message = "^test", group = "<!-- 5 -->Tests" },
  { message = "^(ci|build)", group = "<!-- 6 -->CI and build" },
  { message = "^chore", group = "<!-- 7 -->Chores" },
]
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+"
sort_commits = "oldest"

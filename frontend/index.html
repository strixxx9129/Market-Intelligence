<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="MarketLens: open-source market intelligence and ML monitoring. Educational, not financial advice."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>MarketLens</title>
    <script>
      // Apply the theme before first paint (no light flash in dark mode).
      try {
        const t = localStorage.getItem('theme');
        const dark =
          t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

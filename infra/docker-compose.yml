# Local development stack. Run through the Makefile (`make up`), which passes the root .env.
# Every long-running service has a healthcheck; dependants wait for `service_healthy`, so the
# API never starts before PostgreSQL actually accepts connections.
name: marketlens

x-backend: &backend
  build:
    context: ../backend
    target: dev
  image: marketlens-backend:dev
  env_file: ../.env
  environment: &backend-env
    RAW_DATA_DIR: /data/raw
    REPORTS_DIR: /docs
    MLFLOW_TRACKING_URI: http://mlflow:5000
    # Passed by the Makefile (`git rev-parse` on the host); .git is not visible in containers.
    GIT_SHA: ${GIT_SHA:-unknown}
    GIT_PYTHON_REFRESH: quiet  # MLflow probes for a git binary; we pass GIT_SHA instead
  volumes:
    - ../backend:/app
    - ../data:/data:ro  # the API and one-off commands only read raw data
    - ../docs:/docs  # generated reports (experiment-report.md)

# Celery workers: same image, plus write access to data/ (daily Kaggle download) and the
# Kaggle token (read-only). Only workers ever call external sources, never the API (rule 5).
x-worker: &worker
  <<: *backend
  environment:
    <<: *backend-env
    KAGGLE_REFRESH: "true"
    # prometheus-client multiprocess mode: prefork children write samples here and the
    # worker's main process serves the aggregate on :9808 (see tasks/metrics.py).
    PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus
  volumes:
    - ../backend:/app
    - ../data:/data
    - ../docs:/docs
    - ~/.kaggle:/root/.kaggle:ro
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  seaweedfs:
    image: chrislusf/seaweedfs:4.44
    entrypoint: ["sh", "/entrypoint.sh"]
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    ports:
      - "${S3_PORT:-8333}:8333"
    volumes:
      - seaweedfs_data:/data
      - ./seaweedfs/entrypoint.sh:/entrypoint.sh:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 3s
      retries: 30

  # One-shot: creates the MLflow artifact bucket, then exits 0.
  storage-init:
    build: ./mlflow
    image: marketlens-mlflow:3.16.1
    command: ["python", "/usr/local/bin/ensure_bucket.py"]
    environment: &s3_client_env
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_DEFAULT_REGION: us-east-1
      MLFLOW_S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
      MLFLOW_BUCKET: ${MLFLOW_BUCKET}
      BUCKETS: ${MLFLOW_BUCKET},${BACKTEST_BUCKET:-backtests}
    depends_on:
      seaweedfs:
        condition: service_healthy
    restart: "no"

  mlflow:
    build: ./mlflow
    image: marketlens-mlflow:3.16.1
    command:
      - mlflow
      - server
      - --host=0.0.0.0
      - --port=5000
      - --backend-store-uri=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/mlflow
      - --artifacts-destination=s3://${MLFLOW_BUCKET}
      - --serve-artifacts
      - --allowed-hosts=mlflow,mlflow:5000,localhost,localhost:${MLFLOW_PORT:-5000},127.0.0.1:5000
    environment: *s3_client_env
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    depends_on:
      postgres:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  api:
    <<: *backend
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Queue separation: short daily jobs and long training never compete for the same worker.
  worker:
    <<: *worker
    command: ["celery", "-A", "marketlens.tasks.celery_app", "worker", "--loglevel=INFO",
              "--queues=ingest,features,predict,monitoring", "--concurrency=2",
              "--hostname=daily@%h"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A marketlens.tasks.celery_app inspect ping -d daily@$$HOSTNAME --timeout 5"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 20s

  # One training task at a time; a fresh process per task returns its memory (4 GB dev VM).
  worker-train:
    <<: *worker
    command: ["celery", "-A", "marketlens.tasks.celery_app", "worker", "--loglevel=INFO",
              "--queues=train", "--concurrency=1", "--max-tasks-per-child=1",
              "--hostname=train@%h"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A marketlens.tasks.celery_app inspect ping -d train@$$HOSTNAME --timeout 5"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 20s

  # Exactly ONE beat: it only enqueues jobs on schedule. Its state lives on a volume.
  beat:
    <<: *backend
    command: ["celery", "-A", "marketlens.tasks.celery_app", "beat", "--loglevel=INFO",
              "--schedule=/beat/celerybeat-schedule"]
    volumes:
      - ../backend:/app
      - beat_data:/beat

  # Observability: Prometheus scrapes the API and workers; Grafana shows them next to the
  # monitoring_metrics history from PostgreSQL. Both are published on 127.0.0.1 only.
  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml",
              "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=15d"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 10

  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-marketlens-grafana}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/marketlens.json
      # Expanded inside provisioning/datasources/datasources.yml.
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    depends_on:
      prometheus:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 10

  # Load testing (profile "loadtest"): `make loadtest` runs headless against `api-load`, a
  # second API instance with rate limiting OFF so it measures the service, not the limiter.
  api-load:
    <<: *backend
    profiles: ["loadtest"]
    command: ["uvicorn", "marketlens.main:app", "--host", "0.0.0.0", "--port", "8000",
              "--workers", "2"]
    environment:
      <<: *backend-env
      RATE_LIMIT_ENABLED: "false"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 5s
      timeout: 5s
      retries: 20

  locust:
    image: locustio/locust:2.42.6
    profiles: ["loadtest"]
    volumes:
      - ./loadtest:/mnt/locust:ro
    environment:
      # Env vars (not `command`) so `compose run locust --headless ...` keeps them.
      LOCUST_LOCUSTFILE: /mnt/locust/locustfile.py
      LOCUST_HOST: http://api-load:8000
      ML_API_KEY: ${ML_API_KEY:-}
    ports:
      - "127.0.0.1:8089:8089"
    depends_on:
      api-load:
        condition: service_healthy

  # Jupyter Lab for exploration. Only starts with `make notebook` (profile "eda").
  # No token: the port is published on 127.0.0.1 only, never on the network.
  notebook:
    profiles: ["eda"]
    build:
      context: ../backend
      target: eda
    image: marketlens-backend:eda
    environment:
      MPLBACKEND: Agg
    volumes:
      - ..:/workspace
      - ~/.kaggle:/root/.kaggle:ro  # kaggle.json or access_token
    ports:
      - "127.0.0.1:${NOTEBOOK_PORT:-8888}:8888"

volumes:
  postgres_data:
  redis_data:
  seaweedfs_data:
  beat_data:
  prometheus_data:
  grafana_data:
